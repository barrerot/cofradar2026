<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cofradar · Introducción</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,600&amp;display=swap">
<style>
/* Paleta Cofradar · capa editorial (cera). Claro por defecto; oscuro con el sistema. */
:root{--c-bg:#F7F1E6;--c-borderStrong:#C9B896;--c-primaryBg:#1D1A16;--c-primaryText:#FBF9F5;--c-surface:#FDF9F1;--c-text:#1D1A16;--c-text2:#4A443C;}
@media (prefers-color-scheme: dark){:root{--c-bg:#1C1712;--c-borderStrong:#55473A;--c-primaryBg:#F5F1EA;--c-primaryText:#15120F;--c-surface:#251E17;--c-text:#F7F0E4;--c-text2:#C9BFAE;}}
html,body{margin:0;background:#E6E3DC;font-family:Inter,system-ui,sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#000}}
.demo{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 0}
.repetir{font:600 15px/20px Inter,system-ui,sans-serif;height:44px;padding:0 18px;border-radius:6px;border:1px solid #6A655C;background:#FFF;color:#1D1A16;cursor:pointer}
/* ---- Animación (2,8 s, una vez). --t y --ps permiten congelar un fotograma: --ps: paused; --t: 1.4s ---- */
.cf-a{animation-timing-function:cubic-bezier(.2,.8,.25,1);animation-fill-mode:both;animation-play-state:var(--ps,running)}
.cf-draw{stroke-dasharray:1 1;animation-name:cfDraw;animation-duration:.85s}
.cf-dash{stroke-dasharray:1 1;animation-name:cfDraw;animation-duration:.18s}
@keyframes cfDraw{from{stroke-dashoffset:1;visibility:hidden}to{stroke-dashoffset:0;visibility:visible}}
.cf-pop{transform-box:fill-box;transform-origin:center;animation-name:cfPop;animation-duration:.32s}
@keyframes cfPop{from{transform:scale(0)}to{transform:scale(1)}}
.cf-rise{transform-box:fill-box;transform-origin:50% 100%;animation-name:cfRise;animation-duration:.42s}
@keyframes cfRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cf-ping{transform-box:fill-box;transform-origin:center;stroke-width:0;animation-name:cfPing;animation-duration:.9s;animation-fill-mode:forwards}
@keyframes cfPing{from{transform:scale(1);stroke-width:1.4}to{transform:scale(3.6);stroke-width:0}}
.cf-up{animation-name:cfUp;animation-duration:.6s}
@keyframes cfUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
.cf-in{animation-name:cfIn;animation-duration:.45s}
@keyframes cfIn{from{transform:translateY(10px);clip-path:inset(0 0 100% 0)}to{transform:translateY(0);clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){.cf-a{animation:none!important}}
</style>
</head>
<body>
<div class="demo">
<div id="pantalla">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; background: var(--c-bg); color: var(--c-text); font-family: Inter, system-ui, sans-serif; "><div style="height: 47px; flex: none;"></div><main style="flex: 1 1 auto; display: flex; flex-direction: column; padding: 28px 24px 0 24px;"><div style="display: flex; flex-direction: column; align-items: center;"><svg width="176" height="176" viewBox="0 0 48 48" aria-hidden="true" style="flex: none; display: block; overflow: visible;"><path d="M35.49 33.64A15 15 0 0 1 9.90 18.87" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="round" class="cf-a cf-draw" style="animation-delay: calc(0.1s - var(--t, 0s));"></path><path d="M16.50 11.01A15 15 0 0 1 21.01 9.30" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.25s - var(--t, 0s));"></path><path d="M24.19 9.00A15 15 0 0 1 28.95 9.84" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.41s - var(--t, 0s));"></path><path d="M31.83 11.21A15 15 0 0 1 35.49 14.36" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.57s - var(--t, 0s));"></path><circle cx="12.18" cy="14.77" r="5" fill="none" stroke="var(--c-text)" stroke-width="1.4" class="cf-a cf-ping" style="animation-delay: calc(1.0s - var(--t, 0s));"></circle><g class="cf-a cf-rise" style="animation-delay: calc(0.85s - var(--t, 0s));"><path d="M12.18 -4.43L13.57 2.05C14.58 3.73 16.02 5.65 16.38 7.57L12.18 9.97L7.98 7.57C8.34 5.65 9.78 3.73 10.79 2.05ZM8.94 6.13L15.42 6.13L17.10 19.57L7.26 19.57Z" fill="var(--c-bg)" stroke="var(--c-bg)" stroke-width="5" stroke-linejoin="round"></path><path d="M8.94 6.13L15.42 6.13L17.10 19.57L7.26 19.57Z" fill="var(--c-text)" stroke="var(--c-text)" stroke-width="0.8" stroke-linejoin="round"></path><path d="M12.18 -4.43L13.57 2.05C14.58 3.73 16.02 5.65 16.38 7.57L12.18 9.97L7.98 7.57C8.34 5.65 9.78 3.73 10.79 2.05Z" fill="var(--c-text)" stroke="var(--c-bg)" stroke-width="1.32" stroke-linejoin="round" paint-order="stroke"></path></g></svg><div style="height: 14px;"></div><div style="overflow: hidden; display: flex; justify-content: center;"><h1 class="cf-a cf-up" style="animation-delay: calc(1.1s - var(--t, 0s)); margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 600; letter-spacing: -0.015em; font-size: 54px; line-height: 62px;">Cofradar</h1></div><div class="cf-a cf-in" style="animation-delay: calc(1.75s - var(--t, 0s)); display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 14px; line-height: 20px; color: var(--c-text2);"><span style="display: flex; align-items: center; gap: 6px;"><svg width="20" height="6" aria-hidden="true"><path d="M2 3H18" stroke="var(--c-text)" stroke-width="4" stroke-linecap="round"></path></svg>Confirmado</span><span style="display: flex; align-items: center; gap: 6px;"><svg width="22" height="6" aria-hidden="true"><path d="M0 3H22" stroke="var(--c-text)" stroke-width="4" stroke-dasharray="6 4"></path></svg>Según horario</span><span style="display: flex; align-items: center; gap: 6px;"><svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true" style="flex: none;"><path d="M3.71 7.98L8.29 7.98L9.48 17.50L2.52 17.50Z" fill="var(--c-text)" stroke="var(--c-text)" stroke-width="0.8" stroke-linejoin="round"></path><path d="M6.00 0.50L6.99 5.09C7.70 6.28 8.72 7.64 8.97 9.00L6.00 10.70L3.03 9.00C3.28 7.64 4.30 6.28 5.01 5.09Z" fill="var(--c-text)" stroke="var(--c-bg)" stroke-width="1.20" stroke-linejoin="round" paint-order="stroke"></path></svg>Ahora</span></div></div><div style="margin-top: 40px; display: flex; flex-direction: column; gap: 22px;"><div class="cf-a cf-in" style="animation-delay: calc(1.95s - var(--t, 0s)); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start;"><span aria-hidden="true" style="width: 40px; height: 40px; box-sizing: border-box; border: 1px solid var(--c-borderStrong); border-radius: 10px; background: var(--c-surface); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--c-text)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"></path></svg></span><div style="display: flex; flex-direction: column; gap: 2px;"><h2 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 21px; line-height: 26px; font-weight: 600;">Por dónde va de verdad cada cofradía</h2><p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--c-text2);">La cruz de guía y cada paso, y cuánto puedes fiarte de cada dato.</p></div></div><div class="cf-a cf-in" style="animation-delay: calc(2.07s - var(--t, 0s)); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start;"><span aria-hidden="true" style="width: 40px; height: 40px; box-sizing: border-box; border: 1px solid var(--c-borderStrong); border-radius: 10px; background: var(--c-surface); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--c-text)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span><div style="display: flex; flex-direction: column; gap: 2px;"><h2 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 21px; line-height: 26px; font-weight: 600;">Dar fe</h2><p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--c-text2);">Si la estás viendo, dilo con un toque: ayudas a todos.</p></div></div><div class="cf-a cf-in" style="animation-delay: calc(2.19s - var(--t, 0s)); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start;"><span aria-hidden="true" style="width: 40px; height: 40px; box-sizing: border-box; border: 1px solid var(--c-borderStrong); border-radius: 10px; background: var(--c-surface); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--c-text)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.25"></circle></svg></span><div style="display: flex; flex-direction: column; gap: 2px;"><h2 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 21px; line-height: 26px; font-weight: 600;">Tu ubicación es opcional</h2><p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--c-text2);">Sin ella, Cofradar funciona igual.</p></div></div></div></main><div class="cf-a cf-in" style="animation-delay: calc(2.4s - var(--t, 0s)); flex: none; padding: 16px 16px 34px 16px;"><a href="#" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--c-primaryBg); color: var(--c-primaryText); text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 600;">Empezar</a></div></div>
</div>
<button class="repetir" type="button" onclick="const p=document.getElementById('pantalla');p.innerHTML=p.innerHTML;">Repetir animación</button>
</div>
</body>
</html>
