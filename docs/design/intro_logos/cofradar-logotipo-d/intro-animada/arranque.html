<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cofradar · Arranque</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,600&amp;display=swap">
<style>
/* Paleta Cofradar · capa editorial (cera). Claro por defecto; oscuro con el sistema. */
:root{--c-bg:#F7F1E6;--c-borderStrong:#C9B896;--c-primaryBg:#1D1A16;--c-primaryText:#FBF9F5;--c-surface:#FDF9F1;--c-text:#1D1A16;--c-text2:#4A443C;}
@media (prefers-color-scheme: dark){:root{--c-bg:#1C1712;--c-borderStrong:#55473A;--c-primaryBg:#F5F1EA;--c-primaryText:#15120F;--c-surface:#251E17;--c-text:#F7F0E4;--c-text2:#C9BFAE;}}
html,body{margin:0;background:#E6E3DC;font-family:Inter,system-ui,sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#000}}
.demo{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 0}
.repetir{font:600 15px/20px Inter,system-ui,sans-serif;height:44px;padding:0 18px;border-radius:6px;border:1px solid #6A655C;background:#FFF;color:#1D1A16;cursor:pointer}
/* ---- Animación (2,8 s, una vez). --t y --ps permiten congelar un fotograma: --ps: paused; --t: 1.4s ---- */
.cf-a{animation-timing-function:cubic-bezier(.2,.8,.25,1);animation-fill-mode:both;animation-play-state:var(--ps,running)}
.cf-draw{stroke-dasharray:1 1;animation-name:cfDraw;animation-duration:.85s}
.cf-dash{stroke-dasharray:1 1;animation-name:cfDraw;animation-duration:.18s}
@keyframes cfDraw{from{stroke-dashoffset:1;visibility:hidden}to{stroke-dashoffset:0;visibility:visible}}
.cf-pop{transform-box:fill-box;transform-origin:center;animation-name:cfPop;animation-duration:.32s}
@keyframes cfPop{from{transform:scale(0)}to{transform:scale(1)}}
.cf-rise{transform-box:fill-box;transform-origin:50% 100%;animation-name:cfRise;animation-duration:.42s}
@keyframes cfRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cf-ping{transform-box:fill-box;transform-origin:center;stroke-width:0;animation-name:cfPing;animation-duration:.9s;animation-fill-mode:forwards}
@keyframes cfPing{from{transform:scale(1);stroke-width:1.4}to{transform:scale(3.6);stroke-width:0}}
.cf-up{animation-name:cfUp;animation-duration:.6s}
@keyframes cfUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
.cf-in{animation-name:cfIn;animation-duration:.45s}
@keyframes cfIn{from{transform:translateY(10px);clip-path:inset(0 0 100% 0)}to{transform:translateY(0);clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){.cf-a{animation:none!important}}
</style>
</head>
<body>
<div class="demo">
<div id="pantalla">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; background: var(--c-bg); color: var(--c-text); font-family: Inter, system-ui, sans-serif; "><div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 24px;"><svg width="120" height="120" viewBox="0 0 48 48" aria-hidden="true" style="flex: none; display: block; overflow: visible;"><path d="M35.49 33.64A15 15 0 0 1 9.90 18.87" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="round" class="cf-a cf-draw" style="animation-delay: calc(0.1s - var(--t, 0s));"></path><path d="M16.50 11.01A15 15 0 0 1 21.01 9.30" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.25s - var(--t, 0s));"></path><path d="M24.19 9.00A15 15 0 0 1 28.95 9.84" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.41s - var(--t, 0s));"></path><path d="M31.83 11.21A15 15 0 0 1 35.49 14.36" pathLength="1" fill="none" stroke="var(--c-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.57s - var(--t, 0s));"></path><circle cx="12.18" cy="14.77" r="5" fill="none" stroke="var(--c-text)" stroke-width="1.4" class="cf-a cf-ping" style="animation-delay: calc(1.0s - var(--t, 0s));"></circle><g class="cf-a cf-rise" style="animation-delay: calc(0.85s - var(--t, 0s));"><path d="M12.18 -4.43L13.57 2.05C14.58 3.73 16.02 5.65 16.38 7.57L12.18 9.97L7.98 7.57C8.34 5.65 9.78 3.73 10.79 2.05ZM8.94 6.13L15.42 6.13L17.10 19.57L7.26 19.57Z" fill="var(--c-bg)" stroke="var(--c-bg)" stroke-width="5" stroke-linejoin="round"></path><path d="M8.94 6.13L15.42 6.13L17.10 19.57L7.26 19.57Z" fill="var(--c-text)" stroke="var(--c-text)" stroke-width="0.8" stroke-linejoin="round"></path><path d="M12.18 -4.43L13.57 2.05C14.58 3.73 16.02 5.65 16.38 7.57L12.18 9.97L7.98 7.57C8.34 5.65 9.78 3.73 10.79 2.05Z" fill="var(--c-text)" stroke="var(--c-bg)" stroke-width="1.32" stroke-linejoin="round" paint-order="stroke"></path></g></svg><div style="overflow: hidden; display: flex; justify-content: center;"><h1 class="cf-a cf-up" style="animation-delay: calc(1.1s - var(--t, 0s)); margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 600; letter-spacing: -0.015em; font-size: 48px; line-height: 55px;">Cofradar</h1></div></div></div>
</div>
<button class="repetir" type="button" onclick="const p=document.getElementById('pantalla');p.innerHTML=p.innerHTML;">Repetir animación</button>
</div>
</body>
</html>
