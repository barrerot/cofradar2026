# cofradar.es, cofradar.com y www.cofradar.com llevan a https://www.cofradar.es,
# la dirección principal (despliegue/www.cofradar.es.conf). Va en un archivo
# aparte porque certbot no sabe crear la versión https de un archivo con dos
# VirtualHost.
#
# Instalar (con sudo), con los registros A de los tres apuntando aquí:
#   sudo cp despliegue/cofradar-redireccion.conf /etc/apache2/sites-available/
#   sudo a2ensite cofradar-redireccion && sudo systemctl reload apache2
#   sudo certbot --apache -d cofradar.es -d cofradar.com -d www.cofradar.com
<VirtualHost *:80>
    ServerName cofradar.es
    ServerAlias cofradar.com www.cofradar.com

    Redirect permanent / https://www.cofradar.es/

    ErrorLog ${APACHE_LOG_DIR}/cofradar_error.log
    CustomLog ${APACHE_LOG_DIR}/cofradar_access.log combined
</VirtualHost>
