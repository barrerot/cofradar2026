# Cofradar en su dominio, www.cofradar.es, servido de momento desde el VPS de
# desarrollo (dev.buluu.es, 91.107.207.230) y con la misma contraseña que
# cofradar.buluu.es. Antes del lanzamiento se decide si pasa al VPS de Hestia
# (45.67.217.138), donde sigue el dominio raíz cofradar.es.
#
# Apache solo reenvía al mismo proceso de Node que cofradar.buluu.es
# (127.0.0.1:3010, despliegue/publicar.sh). certbot añade la versión https;
# a ese archivo (www.cofradar.es-le-ssl.conf) hay que añadirle a mano:
#   Include /etc/apache2/cofradar-acceso.conf
#
# Instalar (con sudo), con el registro A de www ya apuntando aquí:
#   sudo cp despliegue/www.cofradar.es.conf /etc/apache2/sites-available/
#   sudo a2ensite www.cofradar.es && sudo systemctl reload apache2
#   sudo certbot --apache -d www.cofradar.es
<VirtualHost *:80>
    ServerName www.cofradar.es

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/cofradar_error.log
    CustomLog ${APACHE_LOG_DIR}/cofradar_access.log combined
</VirtualHost>
