# Usuario y contraseña para cofradar.buluu.es mientras está en desarrollo.
# Se incluye desde el sitio https (cofradar.buluu.es-le-ssl.conf). Para
# quitarla, se borra la línea Include de ese archivo y se recarga Apache.
#
# Los usuarios están en /etc/apache2/.htpasswd-cofradar:
#   sudo htpasswd -c /etc/apache2/.htpasswd-cofradar <usuario>   (el primero; -c crea el archivo)
#   sudo htpasswd /etc/apache2/.htpasswd-cofradar <otro>          (los siguientes)
<Location />
    AuthType Basic
    AuthName "Cofradar · en desarrollo"
    AuthUserFile /etc/apache2/.htpasswd-cofradar
    Require valid-user
</Location>

# El manifiesto y los iconos quedan abiertos: el navegador los pide sin la
# contraseña y, si se le niegan, la app deja de poder instalarse.
<LocationMatch "^/(manifest\.webmanifest|iconos/)">
    Require all granted
</LocationMatch>
