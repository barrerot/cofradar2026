# Cofradar en el VPS de desarrollo (dev.buluu.es, 91.107.207.230).
#
# Apache solo reenvía: la web y la API las sirve un único proceso de Node en
# 127.0.0.1:3010 (despliegue/publicar.sh). certbot añade luego la versión https
# y la redirección desde http.
#
# Instalar (con sudo):
#   sudo cp despliegue/cofradar.buluu.es.conf /etc/apache2/sites-available/
#   sudo a2ensite cofradar.buluu.es && sudo systemctl reload apache2
#   sudo certbot --apache -d cofradar.buluu.es
<VirtualHost *:80>
    ServerName cofradar.buluu.es

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/cofradar_error.log
    CustomLog ${APACHE_LOG_DIR}/cofradar_access.log combined
</VirtualHost>
