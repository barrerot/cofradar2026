<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-*) vale 0 y las
         areas seguras del marco no reservan nada. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cofradar</title>
    <meta
      name="description"
      content="Qué cofradías procesionan, por dónde van realmente y con qué grado de confianza."
    />
    <!-- App instalable (PWA): manifiesto, iconos y color de la barra. El color
         lo cambia tema.ts segun el tema claro u oscuro. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/iconos/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/iconos/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/iconos/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon-180.png" sizes="180x180" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-title" content="Cofradar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Antes de pintar nada: el tema guardado, para que no destelle el claro
         a quien eligio el oscuro, y si toca la pantalla de arranque (P-01):
         solo la primera vez o sin nada guardado; si hay datos guardados, la
         app abre directamente el ultimo estado conocido. Repite a proposito lo
         minimo de src/tema.ts, que lo vuelve a aplicar al cargar. -->
    <script>
      (function () {
        var raiz = document.documentElement;
        try {
          var p = JSON.parse(localStorage.getItem("cofradar:preferencias") || "{}");
          var q = new URLSearchParams(location.search).get("tema");
          var oscuro =
            q === "oscuro" || q === "dark" ||
            (!q && (p.tema === "oscuro" ||
              (p.tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches)));
          raiz.dataset.theme = oscuro ? "dark" : "light";
          if (p.contraste === "max") raiz.dataset.contrast = "max";
          if (!localStorage.getItem("cofradar:ultima-sincronizacion")) raiz.dataset.arranque = "";
        } catch (e) {
          raiz.dataset.arranque = "";
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <!-- P-01 Arranque (logotipo D). Fuera de #raiz para que React no lo borre
         al montar: lo quita src/datos/arranque.ts cuando llegan los datos.
         Es la copia en HTML de src/marco/SimboloAnimado.tsx: si cambia uno,
         cambia el otro. Un toque salta la animación al estado final. -->
    <div class="cf-arranque" data-register="editorial" role="status" aria-label="Cargando Cofradar"
      onpointerdown="this.dataset.saltar = ''">
      <svg class="cf-simbolo-animado" width="120" height="120" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M35.49 33.64A15 15 0 0 1 9.90 18.87" pathLength="1" fill="none" stroke="var(--cf-text)" stroke-width="6" stroke-linecap="round" class="cf-a cf-draw" style="animation-delay: calc(0.1s - var(--t, 0s))"></path>
        <path d="M16.50 11.01A15 15 0 0 1 21.01 9.30" pathLength="1" fill="none" stroke="var(--cf-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.25s - var(--t, 0s))"></path>
        <path d="M24.19 9.00A15 15 0 0 1 28.95 9.84" pathLength="1" fill="none" stroke="var(--cf-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.41s - var(--t, 0s))"></path>
        <path d="M31.83 11.21A15 15 0 0 1 35.49 14.36" pathLength="1" fill="none" stroke="var(--cf-text)" stroke-width="6" stroke-linecap="butt" class="cf-a cf-dash" style="animation-delay: calc(1.57s - var(--t, 0s))"></path>
        <circle cx="12.18" cy="14.77" r="5" fill="none" stroke="var(--cf-text)" stroke-width="1.4" class="cf-a cf-ping" style="animation-delay: calc(1.0s - var(--t, 0s))"></circle>
        <g class="cf-a cf-rise" style="animation-delay: calc(0.85s - var(--t, 0s))">
          <path d="M12.18 -4.43L13.57 2.05C14.58 3.73 16.02 5.65 16.38 7.57L12.18 9.97L7.98 7.57C8.34 5.65 9.78 3.73 10.79 2.05ZM8.94 6.13L15.42 6.13L17.10 19.57L7.26 19.57Z" fill="var(--cf-bg)" stroke="var(--cf-bg)" stroke-width="5" stroke-linejoin="round"></path>
          <path d="M8.94 6.13L15.42 6.13L17.10 19.57L7.26 19.57Z" fill="var(--cf-text)" stroke="var(--cf-text)" stroke-width="0.8" stroke-linejoin="round"></path>
          <path d="M12.18 -4.43L13.57 2.05C14.58 3.73 16.02 5.65 16.38 7.57L12.18 9.97L7.98 7.57C8.34 5.65 9.78 3.73 10.79 2.05Z" fill="var(--cf-text)" stroke="var(--cf-bg)" stroke-width="1.32" stroke-linejoin="round" paint-order="stroke"></path>
        </g>
      </svg>
      <div class="cf-palabra-caja">
        <span class="cf-palabra cf-a cf-up" style="animation-delay: calc(1.1s - var(--t, 0s))">Cofradar</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
