<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-*) vale 0 y las
         areas seguras del marco no reservan nada. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cofradar</title>
    <meta
      name="description"
      content="Qué cofradías procesionan, por dónde van realmente y con qué grado de confianza."
    />
    <!-- App instalable (PWA): manifiesto, iconos y color de la barra. El color
         lo cambia tema.ts segun el tema claro u oscuro. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/iconos/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-title" content="Cofradar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Antes de pintar nada: el tema guardado, para que no destelle el claro
         a quien eligio el oscuro, y si toca la pantalla de arranque (P-01):
         solo la primera vez o sin nada guardado; si hay datos guardados, la
         app abre directamente el ultimo estado conocido. Repite a proposito lo
         minimo de src/tema.ts, que lo vuelve a aplicar al cargar. -->
    <script>
      (function () {
        var raiz = document.documentElement;
        try {
          var p = JSON.parse(localStorage.getItem("cofradar:preferencias") || "{}");
          var q = new URLSearchParams(location.search).get("tema");
          var oscuro =
            q === "oscuro" || q === "dark" ||
            (!q && (p.tema === "oscuro" ||
              (p.tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches)));
          raiz.dataset.theme = oscuro ? "dark" : "light";
          if (p.contraste === "max") raiz.dataset.contrast = "max";
          if (!localStorage.getItem("cofradar:ultima-sincronizacion")) raiz.dataset.arranque = "";
        } catch (e) {
          raiz.dataset.arranque = "";
        }
      })();
    </script>
  </head>
  <body>
    <!-- P-01 Arranque: se ve solo mientras llega el JavaScript. React
         sustituye el contenido de #raiz al arrancar, asi que nunca tapa mas
         tiempo del que tarda la carga. -->
    <div id="raiz">
      <div class="cf-arranque" role="status" aria-label="Cargando Cofradar">
        <span aria-hidden="true">Cofradar</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
